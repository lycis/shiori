name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-clang:
    name: Windows / Clang / C23
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned LLVM
        shell: pwsh
        run: |
          $version = (Get-Content .llvm-version -Raw).Trim()
          $archive = "$env:RUNNER_TEMP\llvm.tar.xz"
          $directory = "$env:RUNNER_TEMP\clang+llvm-$version-x86_64-pc-windows-msvc"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"

          Invoke-WebRequest -Uri $url -OutFile $archive
          tar -xf $archive -C $env:RUNNER_TEMP
          "$directory\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify LLVM toolchain
        shell: pwsh
        run: |
          $expected = (Get-Content .llvm-version -Raw).Trim()
          $actual = (clang-format --version) -replace '^.*?(\d+\.\d+\.\d+).*$','$1'

          clang --version
          clang-format --version
          clang-tidy --version

          if ($actual -ne $expected) {
            throw "Expected LLVM $expected but found $actual"
          }

      - name: Check C formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem src -Include *.c,*.h -File -Recurse | ForEach-Object FullName
          clang-format --dry-run --Werror $files

      - name: Run static analysis
        shell: pwsh
        run: |
          $sources = Get-ChildItem src -Filter *.c | ForEach-Object FullName
          clang-tidy '--warnings-as-errors=*' $sources -- -std=c23 -Isrc -Wall -Wextra -Wpedantic -Werror

      - name: Build release executable
        shell: pwsh
        run: |
          $sources = Get-ChildItem src -Filter *.c | ForEach-Object FullName
          clang -std=c23 -Wall -Wextra -Wpedantic -Werror -O2 -fms-runtime-lib=static $sources -o shiori.exe

      - name: Verify self-contained runtime
        shell: pwsh
        run: |
          $imports = llvm-objdump -p shiori.exe |
            Select-String 'DLL Name:' |
            ForEach-Object { ($_ -split 'DLL Name:')[1].Trim() }
          $imports | ForEach-Object { Write-Host "Imports: $_" }

          $runtimeDlls = $imports | Where-Object {
            $_ -match '^(ucrtbase|vcruntime\d*|msvcp\d*|api-ms-win-crt-.+)\.dll$'
          }
          if ($runtimeDlls) {
            throw "Release depends on dynamically linked C/C++ runtime DLLs: $($runtimeDlls -join ', ')"
          }

      - name: Smoke-check executable
        run: .\shiori.exe version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install integration test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run integration tests
        shell: pwsh
        run: |
          python -m robot `
            --variable "SHIORI_BINARY:$((Resolve-Path .\shiori.exe).Path)" `
            --outputdir build/test-results `
            --xunit xunit.xml `
            tests/integration

      - name: Build AddressSanitizer executable
        shell: pwsh
        run: |
          $sources = Get-ChildItem src -Filter *.c | ForEach-Object FullName
          clang `
            -std=c23 -Wall -Wextra -Wpedantic -Werror `
            -O1 -g -fno-omit-frame-pointer -fsanitize=address `
            $sources -o build/shiori-sanitize.exe
          $resourceDir = clang -print-resource-dir
          Copy-Item "$resourceDir\lib\windows\clang_rt.asan_dynamic-x86_64.dll" build

      - name: Run integration tests with AddressSanitizer
        shell: pwsh
        run: |
          python -m robot `
            --variable "SHIORI_BINARY:$((Resolve-Path .\build\shiori-sanitize.exe).Path)" `
            --outputdir build/sanitize-test-results `
            --xunit xunit.xml `
            tests/integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shiori-integration-test-results
          path: |
            build/test-results
            build/sanitize-test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload standalone executable
        uses: actions/upload-artifact@v6
        with:
          name: shiori-windows-x64
          path: shiori.exe
          if-no-files-found: error
          retention-days: 90
