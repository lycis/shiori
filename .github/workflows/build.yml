name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-clang:
    name: Windows / Clang / C23
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show compiler version
        run: clang --version

      - name: Build release executable
        shell: pwsh
        run: |
          $sources = Get-ChildItem src -Filter *.c | ForEach-Object FullName
          clang -std=c23 -Wall -Wextra -Wpedantic -O2 $sources -o shiori.exe

      - name: Smoke-check executable
        run: .\shiori.exe version
