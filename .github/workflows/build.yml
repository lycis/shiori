name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-clang:
    name: Windows / Clang / C23
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show compiler version
        run: clang --version

      - name: Build release executable
        shell: pwsh
        run: |
          $sources = Get-ChildItem src -Filter *.c | ForEach-Object FullName
          clang -std=c23 -Wall -Wextra -Wpedantic -O2 -fms-runtime-lib=static $sources -o shiori.exe

      - name: Verify self-contained runtime
        shell: pwsh
        run: |
          $imports = llvm-objdump -p shiori.exe |
            Select-String 'DLL Name:' |
            ForEach-Object { ($_ -split 'DLL Name:')[1].Trim() }
          $imports | ForEach-Object { Write-Host "Imports: $_" }

          $runtimeDlls = $imports | Where-Object {
            $_ -match '^(ucrtbase|vcruntime\d*|msvcp\d*|api-ms-win-crt-.+)\.dll$'
          }
          if ($runtimeDlls) {
            throw "Release depends on dynamically linked C/C++ runtime DLLs: $($runtimeDlls -join ', ')"
          }

      - name: Smoke-check executable
        run: .\shiori.exe version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install integration test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run integration tests
        shell: pwsh
        run: |
          python -m robot `
            --variable "SHIORI_BINARY:$((Resolve-Path .\shiori.exe).Path)" `
            --outputdir build/test-results `
            --xunit xunit.xml `
            tests/integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shiori-integration-test-results
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload standalone executable
        uses: actions/upload-artifact@v6
        with:
          name: shiori-windows-x64
          path: shiori.exe
          if-no-files-found: error
          retention-days: 90
